<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひとめぐり 星空教本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;700&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<div id="stage">
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="hud" aria-hidden="true"></div>
  <div id="hud2" aria-hidden="true"></div>
  <canvas id="graph" aria-hidden="true" width="240" height="56"></canvas>
  <div id="inset" aria-hidden="true"><span></span></div>
  <div id="split" role="slider" aria-label="前後對比分割線" tabindex="0"><i></i></div>
  <div id="title" aria-hidden="true"><span class="brand">ひとめぐり</span></div>
  <div id="fallback" aria-hidden="true"><span class="brand">ひとめぐり</span><small>這是沒有 WebGL 時看到的靜態畫面</small></div>
  <button type="button" id="resume" hidden>迴圈已暫停 · 繼續</button>
  <button type="button" id="exitFinale" hidden>回到教本</button>
</div>

<nav id="nav" aria-label="章節"></nav>
<main id="book"></main>

<script type="module" src="/src/main.js"></script>
</body>
</html>
